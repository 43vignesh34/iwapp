name: CI Pipeline to deploy application

on:   
  push: 
    branches: ['**']

jobs:
  ci:
    name: Start the remote VM
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7
      - name: Install pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6
      - name: Install Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install all the required dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build