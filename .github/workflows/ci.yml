# CI: runs on every pull request and on every push to main.
# Jobs: checks (format, lint, typecheck, unit, build), integration (Testcontainers),
# e2e (Playwright on the Compose Postgres), and a secret scan.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same PR cancels the run that's still going for the old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1 # no usage telemetry from CI
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named in package.json's "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: fail if package.json and pnpm-lock.yaml disagree,
      # instead of quietly resolving new versions on the CI machine.
      - id: install
        run: pnpm install --frozen-lockfile

      # Each check runs even if an earlier check failed, so one CI run shows every problem.
      # They're skipped only if the install failed, or if the run was cancelled.
      - run: pnpm format:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts postgres:17 through the runner's Docker (preinstalled on ubuntu-latest).
      - run: pnpm test:int

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same Postgres 17 as local development; e2e uses its own database (iwapp_e2e).
      - run: docker compose up -d --wait postgres
      - run: pnpm --filter @iwapp/e2e exec playwright install --with-deps chromium
      # Builds the packages, prepares the database, starts API + web, runs the browser tests.
      - run: pnpm e2e
      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # gitleaks reads the PR's commit list to know what to scan
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so a secret committed and then deleted is still caught
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
